<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Astra – Side Easter Eggs</title>

  <!-- Astra Theme Styles -->
  <link rel="stylesheet" href="../../../styles/globals.css">
  <link rel="stylesheet" href="../../../styles/neon.css">
  <link rel="stylesheet" href="../../../styles/ee-shared.css">
  <link rel="stylesheet" href="side-ee.css">

  <!-- Global systems -->
  <script src="../../../scripts/header.js" defer></script>
  <script type="module" src="../../../scripts/router.js"></script>
  <script type="module" src="../../../scripts/storage.js"></script>

  <!-- Page-specific JS -->
  <script type="module" src="side-ee.js"></script>
</head>

<body class="metal-bg">
  <div class="overlay-dark"></div>

  <main class="center-container">

    <!-- ⭐ Injected Header (Logo + Version) -->
    <div id="header"></div>

    <section class="side-ee-panel fullscreen-panel">

      <!-- Header -->
      <h1 class="panel-header" style="color: var(--purple-glow);">
        Side Easter Eggs
      </h1>

      <!-- CATEGORY SELECTOR -->
      <div class="selector-wrapper">
        <select id="category-selector" class="neon-btn neon-purple selector-box">
          <option value="">Choose Category:</option>
          <option value="music">Music EEs</option>
          <option value="dg2">DG2 Upgrade</option>
          <option value="jumpscare">Jumpscare</option>
          <option value="ravager">Friendly Ravager</option>
          <option value="goat">Nikolai Goat Toy</option>
          <option value="twins">Ghost Twins</option>
          <option value="gramophone">Gramophone Perks</option>
          <option value="skulls">Glowing Skull Perk</option>
          <option value="powerups">Free Power Ups</option>
          <option value="wisps">Insta-Kill Wisps</option>
        </select>
      </div>

      <!-- STEP PANELS -->
      <div id="steps-container"></div>

      <!-- Controls -->
      <div class="back-row ee-buttons">
        <button class="neon-btn neon-purple" id="back-astra">RETURN TO ASTRA</button>
      </div>

    </section>
  </main>

  <!-- IMAGE ZOOM MODAL -->
  <div id="img-modal" class="img-modal">
    <span id="img-modal-close">&times;</span>
    <img id="img-modal-content">
  </div>

</body>
</html>
