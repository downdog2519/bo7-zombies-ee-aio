<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Ashes – Rocket Code</title>

  <!-- Global theme -->
  <link rel="stylesheet" href="../../../styles/globals.css">
  <link rel="stylesheet" href="../../../styles/neon.css">
  <link rel="stylesheet" href="../../../styles/ee-shared.css">
  <link rel="stylesheet" href="rocket-code.css">
  <link rel="stylesheet" href="rocket-code-panel.css">

  <!-- Global systems -->
  <script src="../../../scripts/header.js" defer></script>
  <script type="module" src="../../../scripts/router.js"></script>
  <script type="module" src="../../../scripts/storage.js"></script>

  <!-- Page-specific JS -->
  <script type="module" src="rocket-code.js"></script>
</head>

<body class="metal-bg">
  <div class="overlay-dark"></div>

  <main class="center-container">

    <!-- ⭐ Injected Header (Logo + Version) -->
    <div id="header"></div>

    <section class="panel fullscreen-panel">

      <h1 class="panel-header" style="color: var(--red-glow);">
        ROCKET CODE
      </h1>

      <div class="panel-scroll">

        <table class="rocket-table">
          <thead>
            <tr>
              <th>Name</th>
              <th>Numeric Code</th>
              <th>Symbols</th>
            </tr>
          </thead>

          <tbody>

            <!-- ROCKET -->
            <tr>
              <td class="rocket-name">Rocket</td>
              <td>
                <span class="code-box">17</span>
                <span class="code-box">14</span>
                <span class="code-box">02</span>
                <span class="code-box">10</span>
                <span class="code-box">04</span>
                <span class="code-box">19</span>
              </td>
              <td>
                <div class="symbols-container">
                  <img src="assets/Screenshot 2026-03-06 180100.png" class="symbol-img zoomable">
                  <img src="assets/Screenshot 2026-03-06 180443.png" class="symbol-img zoomable">
                  <img src="assets/Screenshot 2026-03-06 180613.png" class="symbol-img zoomable">
                </div>
              </td>
            </tr>

            <!-- LAUNCH -->
            <tr>
              <td class="rocket-name">Launch</td>
              <td>
                <span class="code-box">11</span>
                <span class="code-box">00</span>
                <span class="code-box">20</span>
                <span class="code-box">13</span>
                <span class="code-box">02</span>
                <span class="code-box">07</span>
              </td>
              <td>
                <div class="symbols-container">
                  <img src="assets/Screenshot 2026-03-06 180727.png" class="symbol-img zoomable">
                  <img src="assets/Screenshot 2026-03-06 180757.png" class="symbol-img zoomable">
                  <img src="assets/Screenshot 2026-03-06 180836.png" class="symbol-img zoomable">
                </div>
              </td>
            </tr>

            <!-- WEAPON -->
            <tr>
              <td class="rocket-name">Weapon</td>
              <td>
                <span class="code-box">22</span>
                <span class="code-box">04</span>
                <span class="code-box">00</span>
                <span class="code-box">15</span>
                <span class="code-box">14</span>
                <span class="code-box">13</span>
              </td>
              <td>
                <div class="symbols-container">
                  <img src="assets/Screenshot 2026-03-06 180918.png" class="symbol-img zoomable">
                  <img src="assets/Screenshot 2026-03-06 180946.png" class="symbol-img zoomable">
                  <img src="assets/Screenshot 2026-03-06 181011.png" class="symbol-img zoomable">
                </div>
              </td>
            </tr>

            <!-- ENGINE -->
            <tr>
              <td class="rocket-name">Engine</td>
              <td>
                <span class="code-box">04</span>
                <span class="code-box">13</span>
                <span class="code-box">06</span>
                <span class="code-box">08</span>
                <span class="code-box">13</span>
                <span class="code-box">04</span>
              </td>
              <td>
                <div class="symbols-container">
                  <img src="assets/Screenshot 2026-03-06 181043.png" class="symbol-img zoomable">
                  <img src="assets/Screenshot 2026-03-06 181102.png" class="symbol-img zoomable">
                  <img src="assets/Screenshot 2026-03-06 181128.png" class="symbol-img zoomable">
                </div>
              </td>
            </tr>

          </tbody>
        </table>
      </div>
	  
<div class="back-row">
  <button class="neon-btn neon-red" id="return-ee-step" style="display:none;">
    RETURN TO EE STEP
  </button>
</div>

      <div class="back-row">
        <button class="neon-btn neon-red" id="back-ashes">RETURN TO ASHES MENU</button>
      </div>

    </section>
  </main>
</body>
</html>
