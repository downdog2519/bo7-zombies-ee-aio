<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Ashes of the Damned</title>

  <!-- Global styles -->
  <link rel="stylesheet" href="../../styles/globals.css">
  <link rel="stylesheet" href="../../styles/neon.css">
  <link rel="stylesheet" href="../../styles/ee-shared.css">

  <!-- Global systems -->
  <script src="../../scripts/header.js" defer></script>
  <script type="module" src="../../scripts/router.js"></script>
  <script type="module" src="../../scripts/storage.js"></script>

  <!-- Page-specific JS -->
  <script type="module" src="ashes.js"></script>
</head>

<body class="metal-bg">
  <div class="overlay-dark"></div>

  <main class="center-container">

    <!-- ⭐ Injected Header (Logo + Version) -->
    <div id="header"></div>

    <section class="panel fullscreen-panel">
      <h1 class="panel-header" style="color: var(--red-glow);">
        ASHES OF THE DAMNED
      </h1>

      <div class="panel-buttons">
        <button class="neon-btn neon-red" data-action="ee-steps">EE STEPS</button>
        <button class="neon-btn neon-red" data-action="side-quests">SIDE QUESTS</button>
        <button class="neon-btn neon-red" data-action="ingredients">INGREDIENTS</button>
        <button class="neon-btn neon-red" data-action="rocket-code">ROCKET CODE</button>
      </div>

      <div class="back-row">
        <button class="neon-btn neon-red" id="back-main">RETURN TO MAIN MENU</button>
      </div>
    </section>
  </main>
</body>
</html>
