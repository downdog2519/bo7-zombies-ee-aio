<svg xmlns="http://www.w3.org/2000/svg" width="760" height="320" viewBox="0 0 760 320">
  <rect width="760" height="320" rx="12" fill="#0b0b0f"/>
  <text x="380" y="34" text-anchor="middle" fill="#00ff88" font-family="Segoe UI, Arial" font-size="22" font-weight="700">Murder Mystery  Poster Board</text>
  <text x="380" y="58" text-anchor="middle" fill="#c9c9c9" font-family="Segoe UI, Arial" font-size="13">Evidence placement is randomized per run  record each poster below</text>

  <g font-family="Segoe UI, Arial">
    <rect x="30" y="90" width="130" height="170" rx="8" fill="#122018" stroke="#00ff88" stroke-width="2"/>
    <text x="95" y="130" text-anchor="middle" fill="#00ff88" font-size="16" font-weight="700">P1</text>
    <text x="95" y="165" text-anchor="middle" fill="#ddd" font-size="12">Evidence</text>
    <text x="95" y="190" text-anchor="middle" fill="#aaa" font-size="11">slot 1</text>

    <rect x="175" y="90" width="130" height="170" rx="8" fill="#122018" stroke="#00ff88" stroke-width="2"/>
    <text x="240" y="130" text-anchor="middle" fill="#00ff88" font-size="16" font-weight="700">P2</text>
    <text x="240" y="165" text-anchor="middle" fill="#ddd" font-size="12">Culprit</text>
    <text x="240" y="190" text-anchor="middle" fill="#aaa" font-size="11">who did it</text>

    <rect x="320" y="90" width="130" height="170" rx="8" fill="#122018" stroke="#00ff88" stroke-width="2"/>
    <text x="385" y="130" text-anchor="middle" fill="#00ff88" font-size="16" font-weight="700">P3</text>
    <text x="385" y="165" text-anchor="middle" fill="#ddd" font-size="12">Poison</text>
    <text x="385" y="190" text-anchor="middle" fill="#aaa" font-size="11">toxin item</text>

    <rect x="465" y="90" width="130" height="170" rx="8" fill="#122018" stroke="#00ff88" stroke-width="2"/>
    <text x="530" y="130" text-anchor="middle" fill="#00ff88" font-size="16" font-weight="700">P4</text>
    <text x="530" y="165" text-anchor="middle" fill="#ddd" font-size="12">Painting</text>
    <text x="530" y="190" text-anchor="middle" fill="#aaa" font-size="11">match item</text>

    <rect x="610" y="90" width="120" height="170" rx="8" fill="#122018" stroke="#00ff88" stroke-width="2"/>
    <text x="670" y="130" text-anchor="middle" fill="#00ff88" font-size="16" font-weight="700">P5</text>
    <text x="670" y="165" text-anchor="middle" fill="#ddd" font-size="12">Evidence</text>
    <text x="670" y="190" text-anchor="middle" fill="#aaa" font-size="11">slot 5</text>
  </g>

  <text x="380" y="295" text-anchor="middle" fill="#777" font-family="Segoe UI, Arial" font-size="12">Tip: drop screenshots into assets/poster1.png & poster5.png if you want in-game photos</text>
</svg>
