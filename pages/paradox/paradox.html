<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Paradox Junction</title>
  <link rel="stylesheet" href="../../styles/globals.css">
  <link rel="stylesheet" href="../../styles/neon.css">
  <link rel="stylesheet" href="../../styles/ee-shared.css">
  <script src="../../scripts/header.js" defer></script>
  <script type="module" src="paradox.js"></script>
</head>
<body class="metal-bg">
  <div class="overlay-dark"></div>
  <main class="center-container">
    <div id="header"></div>
    <section class="panel fullscreen-panel">
      <h1 class="panel-header" style="color: var(--cyan-glow);">PARADOX JUNCTION</h1>
      <p style="text-align:center;color:var(--cyan-glow);opacity:0.85;margin-bottom:1rem;">
        Wonder Weapon: Sundergat  ·  Boss: Dark Heart
      </p>
      <div class="panel-buttons">
        <button class="neon-btn neon-cyan" data-action="ee-steps">EE STEPS</button>
        <button class="neon-btn neon-cyan" data-action="notes">NOTES MAP</button>
        <button class="neon-btn neon-cyan" data-action="piano">PIANO CODE</button>
        <button class="neon-btn neon-cyan" data-action="side-quests">SIDE QUESTS</button>
      </div>
      <div class="back-row">
        <button class="neon-btn neon-cyan" id="back-main">RETURN TO MAIN MENU</button>
      </div>
    </section>
  </main>
</body>
</html>
