<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Paradox Junction – Side Easter Eggs</title>

  <!-- Global styles -->
  <link rel="stylesheet" href="../../../styles/globals.css">
  <link rel="stylesheet" href="../../../styles/neon.css">
  <link rel="stylesheet" href="../../../styles/ee-shared.css">
  
  <link rel="stylesheet" href="side-eggs.css">

  <!-- Global systems -->
  <script src="../../../scripts/header.js" defer></script>
  <script type="module" src="../../../scripts/router.js"></script>
  <script type="module" src="../../../scripts/storage.js"></script>

  <!-- Page-specific JS -->
  <script type="module" src="side-eggs.js"></script>
</head>

<body class="metal-bg">
  <div class="overlay-dark"></div>

  <main class="center-container">

    <!-- ⭐ Injected Header (Logo + Version) -->
    <div id="header"></div>

    <section class="panel fullscreen-panel fade-in">

      <h1 class="panel-header cyan-title">
        SIDE EASTER EGGS
      </h1>

      <!-- STEP SELECTOR -->
      <div class="selector-wrapper">
        <select id="step-selector" class="neon-btn neon-cyan selector-box">
          <option value="" disabled selected>Select a Category</option>
        </select>
      </div>

      <!-- GRID OF SIDE EGGS -->
      <div id="sideegg-grid" class="sideegg-grid fade-in"></div>

      <!-- BACK BUTTON -->
      <div class="back-row">
        <button class="neon-btn neon-cyan" id="back-paradox">
          RETURN TO PARADOX JUNCTION
        </button>
      </div>

    </section>
  </main>

  <!-- IMAGE ZOOM OVERLAY -->
  <div id="img-zoom-overlay">
    <img src="" alt="Zoomed Image">
  </div>

</body>
</html>
