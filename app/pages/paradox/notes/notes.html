<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Paradox Junction – Notes</title>

  <!-- Global styles -->
  <link rel="stylesheet" href="../../../styles/globals.css">
  <link rel="stylesheet" href="../../../styles/neon.css">
  <link rel="stylesheet" href="../../../styles/ee-shared.css">
  <link rel="stylesheet" href="notes.css">

  <!-- Global systems -->
  <script src="../../../scripts/header.js" defer></script>
  <script type="module" src="../../../scripts/router.js"></script>
  <script type="module" src="../../../scripts/storage.js"></script>

  <!-- Notes logic -->
  <script type="module" src="notes.js"></script>

  <!-- Page-specific inline logic -->
  <script type="module">
    import { Router } from "../../../scripts/router.js";

    document.addEventListener("DOMContentLoaded", () => {

      /* ---------------------------------------------
         CONDITIONAL: SHOW RETURN TO EE ONLY IF
         URL CONTAINS ?from=ee
      --------------------------------------------- */
      const params = new URLSearchParams(window.location.search);
      const fromEE = params.get("from") === "ee";

      const returnEE = document.getElementById("return-ee");
      if (returnEE) {
        returnEE.style.display = fromEE ? "block" : "none";
      }

      /* ---------------------------------------------
         RETURN TO PARADOX JUNCTION (fixed)
      --------------------------------------------- */
      const backBtn = document.getElementById("back-paradox");
      if (backBtn) {
        backBtn.addEventListener("click", () => {
          Router.go("../paradox.html");
        });
      }

      /* ---------------------------------------------
         RETURN TO EE STEP (fixed)
      --------------------------------------------- */
      if (returnEE) {
        returnEE.addEventListener("click", () => {
          Router.go("../easter-egg/easter-egg.html");
        });
      }

    });
  </script>
</head>

<body class="metal-bg">
  <div class="overlay-dark"></div>

  <main class="center-container">

    <!-- ⭐ Injected Header (Logo + Version) -->
    <div id="header"></div>

    <section class="panel fullscreen-panel">

      <h1 class="panel-header" style="color: var(--cyan-glow);">
        NOTES LOCATION
      </h1>

      <!-- MAP SECTION -->
      <div id="mapSection" class="content-section metal-frame">

        <div class="map-wrapper">
          <img src="../../../assets/images/maps/Note-locations.jpg" alt="Map">

          <select id="note1" class="note-input" style="left: 91.3%; top: 26.6%;"></select>
          <select id="note2" class="note-input" style="left: 60.7%; top: 14.3%;"></select>
          <select id="note3" class="note-input" style="left: 50.1%; top: 35.9%;"></select>
          <select id="note4" class="note-input" style="left: 19.2%; top: 11.1%;"></select>
          <select id="note5" class="note-input" style="left: 40.1%; top: 53.4%;"></select>
          <select id="note6" class="note-input" style="left: 65.0%; top: 57.6%;"></select>
          <select id="note7" class="note-input" style="left: 37.2%; top: 77.8%;"></select>
          <select id="note8" class="note-input" style="left: 57.8%; top: 91.0%;"></select>
        </div>

      </div>

      <div class="back-row">

        <button class="neon-btn neon-purple" id="return-ee">
          RETURN TO EE STEP
        </button>

        <button class="neon-btn neon-cyan" id="reset-notes">
          RESET NOTES
        </button>

        <button class="neon-btn neon-cyan" id="back-paradox">
          RETURN TO PARADOX JUNCTION
        </button>

      </div>

    </section>
  </main>
</body>
</html>
