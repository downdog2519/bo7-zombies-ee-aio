<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Ashes – Side Easter Eggs</title>

  <!-- Global styles -->
  <link rel="stylesheet" href="../../../styles/globals.css">
  <link rel="stylesheet" href="../../../styles/neon.css">
  <link rel="stylesheet" href="../../../styles/ee-shared.css">
  <link rel="stylesheet" href="side-ee-ashes.css">

  <!-- Global systems -->
  <script src="../../../scripts/header.js" defer></script>
  <script type="module" src="../../../scripts/router.js"></script>
  <script type="module" src="../../../scripts/storage.js"></script>

  <!-- Page-specific JS -->
  <script type="module" src="side-ee-ashes.js"></script>
</head>

<body>

  <main class="center-container">

    <!-- ⭐ Injected Header (Logo + Version) -->
    <div id="header"></div>

    <section class="panel fullscreen-panel fade-in">

      <h1 class="panel-header" style="color: var(--red-glow);">
        SIDE EASTER EGGS
      </h1>

      <!-- STEP SELECTOR -->
      <div class="selector-wrapper">
        <select id="sideee-selector" class="neon-btn neon-red selector-box">
          <option value="" disabled selected>Select a Category</option>
        </select>
      </div>

      <!-- GRID OF SIDE EE CONTENT -->
      <div id="sideee-grid" class="sideee-grid fade-in"></div>
	  
	  <!-- RETURN TO EE STEP (hidden by default) -->
<div class="back-row">
  <button class="neon-btn neon-red" id="return-ee-step" style="display:none;">
    RETURN TO EE STEP
  </button>
</div>

      <!-- BACK BUTTON -->
      <div class="back-row">
        <button class="neon-btn neon-red" id="back-ashes">
          RETURN TO ASHES MENU
        </button>
      </div>

    </section>
  </main>

  <!-- IMAGE ZOOM OVERLAY -->
  <div id="img-zoom-overlay">
    <img src="" alt="Zoomed Image">
  </div>

</body>
</html>
