<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Astra Malorum</title>
  <link rel="stylesheet" href="../../styles/globals.css">
  <link rel="stylesheet" href="../../styles/neon.css">
  <link rel="stylesheet" href="../../styles/ee-shared.css">
  <script src="../../scripts/header.js" defer></script>
  <script type="module" src="astra.js"></script>
</head>
<body class="metal-bg">
  <div class="overlay-dark"></div>
  <main class="center-container">
    <div id="header"></div>
    <section class="panel fullscreen-panel">
      <h1 class="panel-header" style="color: var(--purple-glow);">ASTRA MALORUM</h1>
      <p id="map-meta" style="text-align:center;color:var(--purple-glow);opacity:0.85;margin-bottom:1rem;"></p>
      <div class="panel-buttons">
        <button class="neon-btn neon-purple" data-action="ee-steps">EE STEPS</button>
        <button class="neon-btn neon-purple" data-action="tracker">CODE TRACKER</button>
        <button class="neon-btn neon-purple" data-action="side-quests">SIDE QUESTS</button>
      </div>
      <div class="back-row">
        <button class="neon-btn neon-purple" id="back-main">RETURN TO MAIN MENU</button>
      </div>
    </section>
  </main>
</body>
</html>
