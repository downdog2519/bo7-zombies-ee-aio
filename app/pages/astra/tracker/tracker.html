<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Astra Malorum – EE Tracker</title>

  <!-- Global + neon styles -->
  <link rel="stylesheet" href="../../../styles/globals.css">
  <link rel="stylesheet" href="../../../styles/neon.css">
  <link rel="stylesheet" href="../../../styles/ee-shared.css">
  <link rel="stylesheet" href="tracker.css">

  <!-- Global systems -->
  <script src="../../../scripts/header.js" defer></script>
  <script type="module" src="../../../scripts/router.js"></script>
  <script type="module" src="../../../scripts/storage.js"></script>

  <!-- Page-specific JS -->
  <script type="module" src="tracker.js"></script>
</head>

<body class="metal-bg">
  <div class="overlay-dark"></div>

  <main class="center-container">

    <!-- ⭐ Injected Header (Logo + Version) -->
    <div id="header"></div>

    <section class="tracker-panel fullscreen-panel">

      <h1 class="panel-header" style="color: var(--purple-glow);">
        ASTRA MALORUM – EE TRACKER
      </h1>

      <div class="tracker-scroll">

        <!-- Planet Directions -->
        <div class="section-title-row">
          <div class="section-title">Planet Directions</div>

          <div class="planet-inline">
            <label>Mars</label>
            <select class="direction-select" data-dir="mars">
              <option>—</option><option>NE</option><option>SE</option><option>SW</option><option>NW</option>
            </select>

            <label>Neptune</label>
            <select class="direction-select" data-dir="neptune">
              <option>—</option><option>NE</option><option>SE</option><option>SW</option><option>NW</option>
            </select>

            <label>Saturn</label>
            <select class="direction-select" data-dir="saturn">
              <option>—</option><option>NE</option><option>SE</option><option>SW</option><option>NW</option>
            </select>
          </div>
        </div>

        <!-- Mars Code -->
        <div class="section-title-row mars-code-row">
          <div class="section-title">Mars Code</div>
          <input type="text" maxlength="4" class="mars-code-inline" id="marsCode" placeholder="####">
        </div>

        <!-- Planet Selector -->
        <div class="section-title-row">
          <div class="section-title">Planets</div>

          <div class="planet-selector-inline">
            <select class="planet-select-inline"></select>
            <select class="planet-select-inline"></select>
            <select class="planet-select-inline"></select>
          </div>
        </div>

        <!-- Books / Statues -->
        <div class="section-title-row">
          <div class="section-title">Books</div>

          <div class="statue-row">

            <!-- Statue 1 -->
            <div class="statue-col">
              <div class="statue-wrapper" data-statue="statue1">
                <div class="statue-dropdown">
                  <span class="statue-label">Statue 1: <span class="statue-count">0</span></span>
                  <span class="dropdown-arrow">▼</span>
                </div>

                <div class="statue-panel">
                  <label><input type="checkbox" value="The Black Veil"> The Black Veil</label>
                  <label><input type="checkbox" value="The Moon Directive"> The Moon Directive</label>
                  <label><input type="checkbox" value="The Musical Universe"> The Musical Universe</label>
                </div>
              </div>

              <img src="assets/statue1.png" class="statue-img zoomable">
            </div>

            <!-- Statue 2 -->
            <div class="statue-col">
              <div class="statue-wrapper" data-statue="statue2">
                <div class="statue-dropdown">
                  <span class="statue-label">Statue 2: <span class="statue-count">0</span></span>
                  <span class="dropdown-arrow">▼</span>
                </div>

                <div class="statue-panel">
                  <label><input type="checkbox" value="Ash And Bone"> Ash And Bone</label>
                  <label><input type="checkbox" value="The Unknowable Void"> The Unknowable Void</label>
                  <label><input type="checkbox" value="Echos Of Andromedia"> Echos Of Andromedia</label>
                </div>
              </div>

              <img src="assets/statue2.png" class="statue-img zoomable">
            </div>

            <!-- Statue 3 -->
            <div class="statue-col">
              <div class="statue-wrapper" data-statue="statue3">
                <div class="statue-dropdown">
                  <span class="statue-label">Statue 3: <span class="statue-count">0</span></span>
                  <span class="dropdown-arrow">▼</span>
                </div>

                <div class="statue-panel">
                  <label><input type="checkbox" value="Pyramid Of Cydonia"> Pyramid Of Cydonia</label>
                  <label><input type="checkbox" value="Witchlight Codex"> Witchlight Codex</label>
                  <label><input type="checkbox" value="Silence At Singulaty"> Silence At Singulaty</label>
                </div>
              </div>

              <img src="assets/statue3.png" class="statue-img zoomable">
            </div>

          </div>
        </div>

        <!-- Mars Symbols -->
        <div class="section-title">
          Mars Symbols <span class="section-title-red">(Drag Images to Match Order)</span>
        </div>

        <div id="symbolContainer" class="symbol-row">
          <div class="symbol-item" draggable="true">
            <span class="symbol-number">1</span>
            <img src="assets/193039.png" class="symbol-preview zoomable">
          </div>

          <div class="symbol-item" draggable="true">
            <span class="symbol-number">2</span>
            <img src="assets/193044.png" class="symbol-preview zoomable">
          </div>

          <div class="symbol-item" draggable="true">
            <span class="symbol-number">3</span>
            <img src="assets/193048.png" class="symbol-preview zoomable">
          </div>

          <div class="symbol-item" draggable="true">
            <span class="symbol-number">4</span>
            <img src="assets/193052.png" class="symbol-preview zoomable">
          </div>

          <div class="symbol-item" draggable="true">
            <span class="symbol-number">5</span>
            <img src="assets/193114.png" class="symbol-preview zoomable">
          </div>
        </div>

        <!-- Zoom Modal -->
        <div id="zoomModal" class="zoom-modal">
          <img id="zoomImage" src="">
        </div>

      </div>

      <!-- Reset Button -->
      <div class="reset-row">
        <button class="neon-btn neon-purple" id="resetTracker">RESET TRACKER</button>
      </div>

      <div class="back-row">
        <button class="neon-btn neon-purple" id="back-egg">RETURN TO EASTER EGG STEPS</button>
      </div>

      <div class="back-row">
        <button class="neon-btn neon-purple" id="back-astra">RETURN TO ASTRA MALORUM</button>
      </div>

    </section>
  </main>
</body>
</html>
