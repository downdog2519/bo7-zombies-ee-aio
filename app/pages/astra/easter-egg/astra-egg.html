<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Astra – Easter Egg Guide</title>

  <!-- Astra Theme Styles -->
  <link rel="stylesheet" href="../../../styles/globals.css">
  <link rel="stylesheet" href="../../../styles/neon.css">
  <link rel="stylesheet" href="../../../styles/ee-shared.css">
  <link rel="stylesheet" href="astra-egg.css">

  <!-- Global systems -->
  <script src="../../../scripts/header.js" defer></script>
  <script type="module" src="../../../scripts/router.js"></script>
  <script type="module" src="../../../scripts/storage.js"></script>

  <!-- Page-specific JS -->
  <script type="module" src="astra-egg.js"></script>
</head>

<body class="metal-bg">
  <div class="overlay-dark"></div>

  <main class="center-container">

    <!-- ⭐ Injected Header (Logo + Version) -->
    <div id="header"></div>

    <section class="astra-egg-panel fullscreen-panel">

      <!-- Header -->
      <h1 class="panel-header" style="color: var(--purple-glow);">
        ASTRA EASTER EGG STEPS
      </h1>

      <!-- PROGRESS BAR -->
      <div id="ee-progress-label" style="color: var(--purple-glow); text-shadow: 0 0 6px var(--purple-glow);">
        0% Complete
      </div>

      <div id="ee-progress-wrapper" style="border: 1px solid var(--purple-glow);">
        <div id="ee-progress-bar" style="background: var(--purple-glow); box-shadow: 0 0 10px var(--purple-glow);"></div>
      </div>

      <!-- Tabs -->
      <div class="tabs">
        <button class="neon-btn neon-purple tab-btn" data-tab="active">ACTIVE STEPS</button>
        <button class="neon-btn neon-purple tab-btn" data-tab="completed">COMPLETED</button>
      </div>

      <!-- Step Selector -->
      <div class="selector-wrapper">
        <select id="step-selector" class="neon-btn neon-purple selector-box"></select>
      </div>

      <!-- ACTIVE STEP DISPLAY -->
      <div id="active-step-display"></div>

      <!-- COMPLETED STEPS -->
      <div id="completed-steps"></div>

      <!-- Controls -->
      <div class="back-row ee-buttons">
        <button class="neon-btn neon-purple" id="reset-ee">RESET EE PROGRESS</button>
        <button class="neon-btn neon-purple" id="back-astra">RETURN TO ASTRA</button>
      </div>

    </section>
  </main>
</body>
</html>
